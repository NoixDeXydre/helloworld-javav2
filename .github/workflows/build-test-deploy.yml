name: "Construction, Tests et Déploiement"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      
env:
  DEPLOY_ENV: production
  PROJECT_VERSION: "1.0.0"
  MAVEN_OPTS: "-Dmaven.repo.local=${{github.workspace}}/.m2/repository"
  
jobs:
  release:
    runs-on: ubuntu-latest
    name: "Préparation JDK"
    steps:
      
    - uses: actions/checkout@v6.1.0
    - name: Set up JDK 17
      uses: actions/setup-java@v6.2.0
      with:
        java-version: '17'
        distribution: "temurin"
        
    - name: Cache Dependances
      uses: actions/cache@main
      with:
        path: "${{github.workspace}}/.m2/repository"
        key: ${{runner.os}}-maven-${{hashfiles('**/pom.xml**')}}
        
    - name: Build
      run: mvn clean package -DSkipTests ${MAVEN_OPTS}
    - name: Upload Maven build artifact
      uses: actions/upload-artifact@v5.0.0
      with:
        name: artifact
        path: ./target/helloworld.jar